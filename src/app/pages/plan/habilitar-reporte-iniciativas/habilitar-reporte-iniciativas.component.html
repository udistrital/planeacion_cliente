<mat-card class="card-oas">
  <mat-card-header>
    <mat-card-title>Definición de fechas para el proceso de iniciativas de inversión</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="formFechas">
      <div class="container-border">
        <h2 class="titulo">Iniciativas de inversión</h2>
        <mat-form-field appearance="fill" [style.width.%]="100">
          <mat-label id="vigencia-input-label">Seleccione la Vigencia</mat-label>
          <mat-select (selectionChange)="onChangeVigencia($event.value)" [formControl]="selectVigencia">
            <mat-option>--</mat-option>
            <mat-option *ngFor="let vigencia of vigencias" [value]="vigencia">
              {{vigencia.Nombre}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="fill" [style.width.%]="100">
          <mat-label id="tipo-input-label">Formulación</mat-label>
          <mat-select (selectionChange)="onChangeProceso($event.value)" [formControl]="selectTipo">
            <mat-option value="formulacion">Formulación</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div>
        <div class="btnUnidades-PlanesProyectos" *ngIf="vigenciaSelected">
          <button mat-raised-button matPrefix color="primary" [disabled]="tipo !== 'formulacion'"
            (click)="banderaTabla('unidades')">Unidades a las que desea asignar el proceso
          </button>
        </div>
        <!-- Tabla Unidades de interés -->
        <div class="table-responsive" *ngIf="tipo == 'formulacion' && vigenciaSelected && banderaUnidadesInteres">
          <app-tabla-unidades (unidadesInteresSeleccionadas)="manejarCambiosUnidadesInteres($event)" [filtroPlan]="false"></app-tabla-unidades>
        </div>
      </div>

      <ng-container *ngIf="tipo == 'formulacion' && vigenciaSelected">
        <div class="container-border-for">
          <h4>Período de Formulación</h4>
          <mat-label class="label-fecha">Desde: </mat-label>
          <mat-form-field appearance="fill" [style.width.%]="30">
            <mat-label>Seleccione una fecha</mat-label>
            <input matInput [matDatepicker]="pickerInicio" formControlName="fechaInicio">
            <mat-hint>DD/MM/AAAA</mat-hint>
            <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
            <mat-datepicker #pickerInicio></mat-datepicker>
          </mat-form-field>
          <mat-label class="label-fecha">Hasta: </mat-label>
          <mat-form-field appearance="fill" [style.width.%]="30">
            <mat-label>Seleccione una fecha</mat-label>
            <input matInput [matDatepicker]="pickerFin" formControlName="fechaFin">
            <mat-hint>DD/MM/AAAA</mat-hint>
            <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
            <mat-datepicker #pickerFin></mat-datepicker>
          </mat-form-field>
        </div>
      </ng-container>
    </form>
  </mat-card-content>
  <mat-card-footer *ngIf="vigenciaSelected && tipoSelected" style="text-align: center;">
    <button mat-raised-button color="primary" [disabled]="guardarDisabled" (click)="guardar()">
      Guardar
    </button>
    <button mat-raised-button color="primary" (click)="limpiarForm()">
      Limpiar
    </button>
  </mat-card-footer>
</mat-card>
