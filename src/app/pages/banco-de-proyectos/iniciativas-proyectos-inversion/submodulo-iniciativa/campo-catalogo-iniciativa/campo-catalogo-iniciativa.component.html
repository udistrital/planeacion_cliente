<mat-form-field [appearance]="apariencia" class="iniciativa-campo" [class.iniciativa-campo--sin-etiqueta]="!conEtiqueta">
  <mat-label *ngIf="conEtiqueta">{{ nodo.nombre }}</mat-label>
  <input matInput [formControl]="control" [matAutocomplete]="sugerencias" (blur)="alSalir()"
    [required]="nodo.dato.required" placeholder="Escriba el código o parte del nombre"
    [attr.aria-label]="conEtiqueta ? null : nodo.nombre">
  <mat-autocomplete #sugerencias="matAutocomplete" [displayWith]="mostrar" (optionSelected)="seleccionar($event.option.value)">
    <mat-option *ngFor="let item of sugerencias$ | async" [value]="item">{{ item.codigo }} - {{ item.nombre }}</mat-option>
  </mat-autocomplete>
  <mat-hint *ngIf="cargando">Cargando catálogo…</mat-hint>
  <mat-hint *ngIf="!cargando && nodo.dato.depende_de && !padre">Primero seleccione el campo del que depende.</mat-hint>
  <mat-hint *ngIf="!cargando && nodo.descripcion && (!nodo.dato.depende_de || padre)">{{ nodo.descripcion }}</mat-hint>
</mat-form-field>
