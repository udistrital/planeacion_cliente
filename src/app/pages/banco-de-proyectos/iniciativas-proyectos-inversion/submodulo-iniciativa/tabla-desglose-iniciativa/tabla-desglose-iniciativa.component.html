<header class="iniciativa-repetible__encabezado" *ngIf="conTitulo || nodo.descripcion">
  <h4 *ngIf="conTitulo">{{ nodo.nombre }}</h4>
  <span class="iniciativa-ayuda" *ngIf="nodo.descripcion">{{ nodo.descripcion }}</span>
</header>

<div class="tabla-caja">
  <table class="tabla-desglose" [class.tabla--solo-numericas]="soloNumericas" [style.min-width.px]="anchoMinimo">
    <colgroup>
      <col class="col-numero">
      <col class="col-origen">
      <col *ngFor="let campo of estructura.campos; trackBy: porClave" [class.col-numerica]="esCampoNumerico(campo)">
      <col class="col-acciones col-acciones--una" *ngIf="conAcciones">
    </colgroup>
    <thead>
      <tr>
        <th scope="col">N.°</th>
        <th scope="col">{{ etiqueta }}</th>
        <th scope="col" *ngFor="let campo of estructura.campos; trackBy: porClave" [class.col-valor]="esCampoNumerico(campo)"
          [class.con-ayuda]="campo.descripcion" [matTooltip]="campo.descripcion">{{ campo.nombre }}</th>
        <th scope="col" class="col-acciones col-acciones--una" *ngIf="conAcciones">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="!vista.length">
        <td [attr.colspan]="totalColumnas" class="vacio">Aún no hay elementos de origen: complete primero el submódulo del que depende.</td>
      </tr>

      <ng-container *ngFor="let fila of vista; trackBy: porFila">
        <tr *ngFor="let parte of fila.partes; let primera = first; trackBy: porParte" [class.primera-subfila]="primera"
          [class.subfila]="!primera">
          <ng-container *ngIf="primera">
            <td class="numero" [attr.rowspan]="fila.partes.length"><span class="chip">{{ fila.numero }}</span></td>
            <!-- Elemento de origen; en una fila agregada, «Otro: ¿Cuál?» y el nombre que escribe el usuario -->
            <td class="origen" [attr.rowspan]="fila.partes.length" [class.con-error]="conError(rutaDeFila(fila), campoEnOrigen(fila))">
              <span class="origen__nombre">{{ textoOrigen(fila) }}</span>
              <span class="origen__ayuda" *ngIf="ayudaOrigen(fila) as ayuda">{{ ayuda }}</span>
              <app-celda-iniciativa *ngIf="campoEnOrigen(fila) as campo" [fila]="fila.fila" [campo]="campo" [ruta]="rutaDeFila(fila)"
                [numero]="fila.numero" [contexto]="contexto" [textoVacio]="'Escriba cuál'"></app-celda-iniciativa>
            </td>
          </ng-container>

          <ng-container *ngFor="let campo of estructura.campos; trackBy: porClave">
            <!-- Campo que aplica a la fila: una celda para todas sus subfilas -->
            <ng-container *ngIf="aplica(campo, fila); else reemplazado">
              <td *ngIf="primera" [attr.rowspan]="fila.partes.length" [class.con-error]="conError(rutaDeFila(fila), campo)">
                <app-celda-iniciativa [fila]="fila.fila" [campo]="campo" [ruta]="rutaDeFila(fila)" [numero]="fila.numero"
                  [contexto]="contexto" [filaOrigen]="fila.origen" [textoVacio]="textoVacio(nodo)"></app-celda-iniciativa>
              </td>
            </ng-container>

            <!-- Campo que no aplica: su columna la ocupa el desglose, una subfila por elemento -->
            <ng-template #reemplazado>
              <td *ngIf="parte.hija; else noAplica" [class.elemento]="campo.dato.clave === fila.primeraReemplazada"
                [class.con-error]="conError(rutaDeHija(fila, parte.hija), campoDelDesglose(campo))">
                <span *ngIf="campo.dato.clave === fila.primeraReemplazada; else campoInterno">{{ textoElemento(parte) }}</span>
                <ng-template #campoInterno>
                  <app-celda-iniciativa *ngIf="campoDelDesglose(campo) as interno" [fila]="parte.hija" [filas]="hijasDe(fila)" [campo]="interno"
                    [ruta]="rutaDeHija(fila, parte.hija)" [numero]="fila.numero + ', ' + textoElemento(parte)" [contexto]="contexto"
                    [textoVacio]="textoVacio(estructura.desglose)"></app-celda-iniciativa>
                </ng-template>
              </td>
              <ng-template #noAplica>
                <td><span class="no-aplica" matTooltip="No aplica">N/A</span></td>
              </ng-template>
            </ng-template>
          </ng-container>

          <!-- Solo las filas agregadas se eliminan: las del origen salen de él -->
          <td *ngIf="primera && conAcciones" class="acciones" [attr.rowspan]="fila.partes.length">
            <button *ngIf="fila.agregada" mat-icon-button color="primary" type="button" (click)="eliminar(fila)"
              matTooltip="Eliminar {{ etiquetaAdicional | lowercase }}" [attr.aria-label]="'Eliminar ' + (etiquetaAdicional | lowercase) + ' ' + fila.numero">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>

        <tr class="fila-errores" *ngIf="erroresDeFila(fila).length">
          <td [attr.colspan]="totalColumnas">
            <div class="iniciativa-error" *ngFor="let mensaje of erroresDeFila(fila)">{{ mensaje }}</div>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>

<!-- Filas que agrega el usuario (filas_adicionales, p. ej. «Otro: ¿Cuál?»); desaparece al llegar al máximo -->
<button *ngIf="puedeAgregar" mat-stroked-button color="primary" type="button" class="agregar" (click)="agregar()">
  <mat-icon>add</mat-icon> Agregar {{ etiquetaAdicional | lowercase }}
</button>
