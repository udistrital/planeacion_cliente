<header class="iniciativa-repetible__encabezado" *ngIf="conTitulo || nodo.descripcion">
  <h4 *ngIf="conTitulo">{{ nodo.nombre }}</h4>
  <span class="iniciativa-ayuda" *ngIf="nodo.descripcion">{{ nodo.descripcion }}</span>
</header>

<div class="tabla-caja">
  <table class="tabla-traida" [style.min-width.px]="anchoMinimo">
    <thead>
      <tr>
        <th scope="col" class="col-numero">N.°</th>
        <th scope="col" *ngFor="let campo of columnas; let columna = index; trackBy: porClave" [class.col-valor]="numericas[columna]"
          [class.con-ayuda]="campo.descripcion" [matTooltip]="campo.descripcion">{{ campo.nombre }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="!vista.length">
        <td [attr.colspan]="columnas.length + 1" class="vacio">Aún no hay elementos de origen: complete primero el submódulo del que depende.</td>
      </tr>
      <tr *ngFor="let fila of vista; trackBy: porId">
        <td class="numero"><span class="chip">{{ fila.numero }}</span></td>
        <td *ngFor="let valor of fila.valores; let columna = index" [class.col-valor]="numericas[columna]">
          <span *ngIf="texto(columna, valor) as contenido; else sinValor">{{ contenido }}</span>
          <ng-template #sinValor><span class="sin-valor">—</span></ng-template>
        </td>
      </tr>
    </tbody>
    <tfoot *ngIf="totales.length">
      <tr class="fila-total">
        <th scope="row" [attr.colspan]="1 + columnasDeEtiqueta">Total</th>
        <td *ngFor="let total of totales" class="col-valor">{{ textoTotal(total) }}</td>
      </tr>
    </tfoot>
  </table>
</div>
