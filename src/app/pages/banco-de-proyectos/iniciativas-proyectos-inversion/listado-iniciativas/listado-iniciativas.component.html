<mat-card class="card-oas">
    <mat-card-header>
        <mat-card-title>Iniciativas para proyectos de inversión</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <u class="textGuide">
            En esta sección usted podrá visualizar las iniciativas registradas para proyectos de inversión.
        </u>
    </mat-card-content>
    <mat-card-content>
        <mat-form-field appearance="standard" [style.width.%]="50">
            <mat-label>Búsqueda</mat-label>
            <input matInput (keyup)="filtrar($event)" placeholder="Ej. Iniciativa" #busqueda>
        </mat-form-field>
        <div class="mat-elevation-z8">
            <div class="table-responsive">
                <table mat-table [dataSource]="iniciativas">
                    <ng-container matColumnDef="numero">
                        <th mat-header-cell *matHeaderCellDef class="columnaId"> Id </th>
                        <td mat-cell *matCellDef="let fila" class="columnaId"> {{ fila.numero }} </td>
                    </ng-container>
                    <ng-container matColumnDef="nombre">
                        <th mat-header-cell *matHeaderCellDef> Nombre de la iniciativa </th>
                        <td mat-cell *matCellDef="let fila"> {{ fila.nombre }} </td>
                    </ng-container>
                    <ng-container matColumnDef="estado">
                        <th mat-header-cell *matHeaderCellDef> Estado </th>
                        <td mat-cell *matCellDef="let fila"> {{ fila.estado.nombre }} </td>
                    </ng-container>
                    <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef class="tituloAcciones">
                            <button *ngIf="esFormulador; else tituloAcciones" class="material-icons" mat-icon-button
                                matTooltip="Nueva iniciativa" matTooltipPosition="right" [disabled]="creando" (click)="nuevaIniciativa()">
                                <mat-icon>add_box</mat-icon>
                            </button>
                            <ng-template #tituloAcciones>Acciones</ng-template>
                        </th>
                        <td mat-cell *matCellDef="let fila" class="botonesAcciones">
                            <button *ngIf="puedeFormular(fila); else consultar" mat-icon-button matTooltip="Formular" (click)="abrir(fila.id)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <ng-template #consultar>
                                <button mat-icon-button matTooltip="Consultar" (click)="abrir(fila.id)"><mat-icon>search</mat-icon></button>
                            </ng-template>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
                    <tr mat-row *matRowDef="let fila; columns: columnas;"></tr>
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" [attr.colspan]="columnas.length">{{ mensajeSinFilas(busqueda.value) }}</td>
                    </tr>
                </table>
            </div>
            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccione la página de iniciativas"></mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
